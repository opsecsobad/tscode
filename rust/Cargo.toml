[package]
name = "tscode"
version = "0.1.0"
edition = "2021"
description = "Terminal Studio Code - a VS Code look-alike that runs in your terminal"

[dependencies]
crossterm = "0.29"
vt100 = "0.18"
portable-pty = "0.9"
unicode-width = "0.2"
serde_json = "1"
libc = "0.2"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-md = "0.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-php = "0.25"
tree-sitter-sequel = "0.3"
tree-sitter-xml = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
