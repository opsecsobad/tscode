[project]
name = "tscode"
version = "0.1.0"
description = "Terminal Studio Code - a VS Code look-alike that runs in your terminal"
requires-python = ">=3.12"
dependencies = [
    "textual[syntax]>=8.2,<9",
    "pyte>=0.8.2",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-php>=0.25.1",
]

[project.scripts]
tscode = "tscode.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tscode"]
